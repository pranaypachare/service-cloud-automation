<template>
    <lightning-card title="My Assigned Cases">
        <template if:true={cases}>
            <table class="slds-teble slds-table_bordered slds-table_cell-buffer">
                <thead>
                    <tr>
                        <th>Case Number</th>
                        <th>Subject</th>
                        <th>Status</th>
                        <th>Action</th>                        
                    </tr>
                </thead>
                <tbody>
                    <template for:each={cases} for:item="caseRecord">
                        <tr key={caseRecord.Id}>
                            <td>{caseRecord.CaseNumber}</td>
                            <td>{caseRecord.Subject}</td>
                            <td>{caseRecord.Status}</td>
                            <td>
                                <lightning-combobox 
                                data-id={caseRecord.Id}
                                value={caseRecord.Status}
                                options={statusOptions}
                                onchange={handleStatusChange}>
                                </lightning-combobox>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </template>
        <template if:true={error}>
            <p>Error Loading Case: {error}</p>
        </template>
    </lightning-card>
</template>
